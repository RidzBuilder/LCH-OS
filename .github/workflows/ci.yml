name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          pip install -r apps/api/requirements.txt
          pip install ruff mypy pytest pytest-asyncio
      - name: Ruff
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            files="$(git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" -- packages apps | grep -E '\\.py$' || true)"
            if [ -n "$files" ]; then
              ruff check $files
            else
              echo "No changed Python files under packages/ or apps/."
            fi
          else
            ruff check packages apps
          fi
      - name: Mypy
        run: mypy packages --ignore-missing-imports
      - name: Tests
        run: PYTHONPATH=. pytest tests -v

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build dashboard
        working-directory: apps/dashboard
        run: |
          npm install
          npm run build
