name: LCH-OS Conformance Schema

on:
  pull_request:
    paths:
      - "specifications/**"
      - "conformance/**"
      - ".github/workflows/lch-conformance-schema.yml"
  push:
    branches: [main, "feat/**"]
    paths:
      - "specifications/**"
      - "conformance/**"
      - ".github/workflows/lch-conformance-schema.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  schema-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install validator
        run: python -m pip install -r conformance/requirements-dev.txt
      - name: Validate schemas and registries
        run: python conformance/validate_registry.py --root specifications
      - name: Run conformance harness unit tests
        run: python -m unittest discover -s conformance/tests -v
