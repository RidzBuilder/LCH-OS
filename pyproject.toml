[project]
name = "lch-os"
version = "0.1.0"
description = "Live Creator Hub Operating System — Universe AI Agent execution layer for PBOS"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
